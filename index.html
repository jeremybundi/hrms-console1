<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/hrmspay-icon.png" />
    <link rel="apple-touch-icon" href="/hrmspay-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HRMSPAY Console</title>
    <script>
      // Set the chosen theme before the page paints, so it doesn't flash light first.
      try {
        var t = localStorage.getItem('hrms-console-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
